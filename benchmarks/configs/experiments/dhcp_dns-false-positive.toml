# The false-positive plate: the dhcp_dns-smoke instance on a healthy lab.
# The task is the one that scenario already writes, the fault is compiled and
# bound so the oracles resolve, and it is never injected. Any mutation asked for
# on a network that needed none is the failure this plate measures.
experiment_id = "sme01-dns-dhcp-provisioning-nofault"
scenario_id = "dhcp_dns.dhcp_provisioning.m1"
scenarios_root = "scenarios"
topology_descriptor = "scenarios/topologies/sme_leaf_spine_dmz_dns.yaml"
testbed_config = "benchmarks/configs/testbeds/sme01-dns.toml"
execution_budget_seconds = 400
result_dir = "reports/manual/results"
report_dir = "reports/manual"
cleanup = "restore"
seed = 9
fault_applicable = false
