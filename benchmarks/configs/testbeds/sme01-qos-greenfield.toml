# Same lab as sme01-qos, started with no shaping policy at all. The competing flow
# is the fault in the assured_bandwidth family, so the agent has to design the
# policy rather than repair one, and the link must not arrive already shaped.
id = "sme01-qos"
platform = "containerlab"
topology_descriptor = "scenarios/topologies/sme_wan_edge_qos.yaml"
topology_file = "benchmarks/testbeds/containerlab/sme01-qos/topology.clab.yml"
reference_state = "benchmarks/testbeds/containerlab/sme01-qos/states/healthy_greenfield.json"
healthy_timeout_seconds = 240
healthy_interval_seconds = 2
repair_convergence_timeout_seconds = 30
repair_convergence_interval_seconds = 2
