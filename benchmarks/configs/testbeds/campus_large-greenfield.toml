# Same lab as campus_large, started with no class policy on the remote site's circuit.
# The competing flow is the fault in the assured_bandwidth family, so the agent has
# to design the policy rather than repair one, and the circuit must not arrive
# already shaped.
id = "campus_large"
platform = "containerlab"
topology_descriptor = "scenarios/topologies/campus_large.yaml"
topology_file = "benchmarks/testbeds/containerlab/campus_large/topology.clab.yml"
reference_state = "benchmarks/testbeds/containerlab/campus_large/states/healthy_greenfield.json"
healthy_timeout_seconds = 420
healthy_interval_seconds = 2
repair_convergence_timeout_seconds = 30
repair_convergence_interval_seconds = 2
