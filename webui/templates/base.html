<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AIBNArena{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/">AIBNArena</a>
      <span class="subtitle">{% block subtitle %}one manual episode: start a subject, judge it, stop it{% endblock %}</span>
      <nav>
        <a href="/">Episode</a>
        <a href="/campaigns">Campaign</a>
        <a href="/models">Models</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <script src="/static/time.js"></script>
    <script src="/static/reports.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
