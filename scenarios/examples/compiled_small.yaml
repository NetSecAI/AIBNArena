      version: 1.0.0
    preservation:
      path: scenarios/oracles/connectivity/preservation-v1.yaml
      version: 1.0.0
  public:
    intent: Restore the intended IPv4 connectivity between affected endpoints without
      disrupting healthy paths.
  private:
    scenario_definition: drop_traffic_to_from_subnet
    bindings:
      target: leaf2
      interface: ethernet-1/30
      segment: finance_vlan
      subnet_prefix: 10.10.30.0/24
      affected_nodes:
      - finance1
    evaluator:
      selected_method:
        id: 1
        name: router_drops_traffic_from_subnet
        selector:
          node: gateway
          subnet: required_endpoint_segment
        operation:
