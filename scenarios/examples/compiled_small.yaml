- id: connectivity.drop_traffic_to_from_subnet.m1
  domain: connectivity
  version: 1.0.0
  oracles:
    healthy:
      path: scenarios/oracles/connectivity/healthy-v1.yaml
      version: 1.0.0
    expected_degradation:
