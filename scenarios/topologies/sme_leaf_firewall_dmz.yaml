schema_version: "0.1"
topology:
  id: sme_leaf_firewall_dmz
  name: Small SME topology with layer-2 access and aggregation behind two back-to-back VyOS firewalls
  size: small
  profile: enterprise_sme
  defaults:
    endpoint_interface_mtu: 1500
    # How the zone rulesets are named on the enforcers. The healthy state renders
    # this spelling and every filtering fault addresses a ruleset by it, so the
    # two can never drift apart.
    zone_ruleset_template: "{from_zone}-TO-{to_zone}"
  environment:
    type: containerlab
    lab_name: sme01-fw
    topology_path: benchmarks/testbeds/containerlab/sme01-fw/topology.clab.yml
  nodes:
    # Internal firewall: inter-VLAN gateway for every internal VLAN and the
    # internal segmentation policy. Everything leaving the enterprise is routed
    # to fw-ext over the transit link; it is the only way out.
    fw-int:
      kind: vyos
      roles: [firewall, gateway, router, inter_vlan_router, transit]
      capabilities: [ipv4_forwarding, inter_vlan_routing, security_zones, zone_policy, vlan, trunk, acl, static_routing]
      interfaces:
        "eth1.10": {segment: users_vlan, ipv4: 10.10.10.1/24, zone: USERS}
        "eth1.20": {segment: guest_vlan, ipv4: 10.10.20.1/24, zone: GUEST}
        "eth1.30": {segment: finance_vlan, ipv4: 10.10.30.1/24, zone: FINANCE}
        "eth1.99": {segment: mgmt_vlan, ipv4: 10.10.99.1/24, zone: MGMT}
        "eth2": {segment: fw_transit, ipv4: 10.255.1.1/30, zone: UPLINK}
    # External firewall: the DMZ and the Internet, the service-level policy in
    # front of them, and the only NAT in the topology.
    fw-ext:
      kind: vyos
      roles: [firewall, gateway, router, transit]
      capabilities: [ipv4_forwarding, security_zones, zone_policy, acl, nat, static_routing]
      interfaces:
        "eth1": {segment: fw_transit, ipv4: 10.255.1.2/30, zone: INTERNAL}
        "eth2": {segment: dmz_web, ipv4: 10.10.40.1/24, zone: DMZ}
        "eth3": {segment: dmz_app, ipv4: 10.10.50.1/24, zone: DMZ}
        "eth4": {segment: internet, ipv4: 203.0.113.1/24, zone: OUTSIDE}
    # Layer-2 aggregation between the leaves and the internal firewall. It
    # holds no address: a spine that routed would be a way around fw-int.
    # Single switch, and single point of failure -- see the lab README for
    # why a second one was built and then removed.
    spine1:
      kind: nokia_srlinux
      roles: [spine, switch, aggregation_switch, bridge]
      capabilities: [layer2_switching, mac_vrf, vlan, trunk, acl, qos]
      interfaces:
        "ethernet-1/1": {segment: trunk_l1_s1}
        "ethernet-1/2": {segment: trunk_l2_s1}
        "ethernet-1/3": {segment: trunk_s1_fw}
    leaf1:
      kind: nokia_srlinux
      roles: [leaf, switch, access_switch, bridge]
      capabilities: [layer2_switching, mac_vrf, vlan, trunk, acl, qos]
      interfaces:
        "ethernet-1/1": {segment: trunk_l1_s1}
        "ethernet-1/10": {segment: users_vlan, attached_endpoint: user1}
        "ethernet-1/20": {segment: guest_vlan, attached_endpoint: guest1}
        "ethernet-1/30": {segment: guest_vlan, attached_endpoint: attacker1}
        "ethernet-1/57": {segment: mgmt_vlan, attached_endpoint: admin1}
    leaf2:
      kind: nokia_srlinux
      roles: [leaf, switch, access_switch, bridge]
      capabilities: [layer2_switching, mac_vrf, vlan, trunk, acl, qos]
      interfaces:
        "ethernet-1/1": {segment: trunk_l2_s1}
        "ethernet-1/30": {segment: finance_vlan, attached_endpoint: finance1}
    user1:
      kind: linux
      roles: [client, employee]
      capabilities: [ipv4]
      interfaces:
        eth1: {segment: users_vlan, ipv4: 10.10.10.10/24}
    guest1:
      kind: linux
      roles: [client, guest]
      capabilities: [ipv4, traffic_generation]
      interfaces:
        eth1: {segment: guest_vlan, ipv4: 10.10.20.10/24}
    finance1:
      kind: linux
      roles: [client, restricted_endpoint]
      capabilities: [ipv4]
      interfaces:
        eth1: {segment: finance_vlan, ipv4: 10.10.30.10/24}
    web1:
      kind: linux
      roles: [server, dmz_server]
      capabilities: [ipv4, http_server]
      interfaces:
        eth1: {segment: dmz_web, ipv4: 10.10.40.10/24}
    app1:
      kind: linux
      roles: [server, application_server]
      capabilities: [ipv4, traffic_sink]
      interfaces:
        eth1: {segment: dmz_app, ipv4: 10.10.50.10/24}
    external1:
      kind: linux
      roles: [client, external_client]
      capabilities: [ipv4, traffic_generation]
      interfaces:
        eth1: {segment: internet, ipv4: 203.0.113.10/24}
    admin1:
      kind: linux
      roles: [admin_client, management_actor]
      capabilities: [ipv4, network_management]
      interfaces:
        eth1: {segment: mgmt_vlan, ipv4: 10.10.99.100/24}
  connectivity_requirements:
    - {source: user1, destination: web1, bidirectional: true}
    - {source: user1, destination: app1, bidirectional: true}
    - {source: guest1, destination: web1, bidirectional: true}
    - {source: finance1, destination: app1, bidirectional: true}
    - {source: external1, destination: web1, bidirectional: true}
  optional_nodes:
    attacker1:
      kind: linux
      roles: [attacker]
      capabilities: [ipv4, raw_packets, packet_capture, traffic_generation, vlan_tagging, arp_spoofing]
      attachable_segments: [users_vlan, guest_vlan, mgmt_vlan]
  segments:
    # One 802.1Q trunk per leaf up to the aggregation switch, and one from the
    # aggregation switch to the internal firewall. Every one of them is a
    # single point of failure for what it carries.
    trunk_l1_s1: {type: trunk, members: [leaf1, spine1], tagged_vlans: [10, 20, 99], zone: INTERNAL, capacity_mbps: 1000}
    trunk_l2_s1: {type: trunk, members: [leaf2, spine1], tagged_vlans: [30], zone: INTERNAL, capacity_mbps: 1000}
    trunk_s1_fw: {type: trunk, members: [spine1, fw-int], tagged_vlans: [10, 20, 30, 99], zone: INTERNAL, capacity_mbps: 1000}
    # The routed link between the two firewalls: the only way out of INTERNAL.
    fw_transit:
      type: p2p
      cidr: 10.255.1.0/30
      members: [fw-int, fw-ext]
      security_zone: transit
      capacity_mbps: 1000
    users_vlan:
      type: vlan
      vlan_id: 10
      cidr: 10.10.10.0/24
      bridge_domain: vlan10
      zone: USERS
      members: [leaf1, spine1, fw-int, user1]
      security_zone: users
      capacity_mbps: 1000
    guest_vlan:
      type: vlan
      vlan_id: 20
      cidr: 10.10.20.0/24
      bridge_domain: vlan20
      zone: GUEST
      members: [leaf1, spine1, fw-int, guest1, attacker1]
      security_zone: guest
      capacity_mbps: 1000
    finance_vlan:
      type: vlan
      vlan_id: 30
      cidr: 10.10.30.0/24
      bridge_domain: vlan30
      zone: FINANCE
      members: [leaf2, spine1, fw-int, finance1]
      security_zone: finance
      capacity_mbps: 1000
    mgmt_vlan:
      type: management
      vlan_id: 99
      cidr: 10.10.99.0/24
      bridge_domain: vlan99
      zone: MGMT
      members: [leaf1, spine1, fw-int, admin1]
      security_zone: management
      capacity_mbps: 1000
    dmz_web:
      type: lan
      cidr: 10.10.40.0/24
      zone: DMZ
      members: [fw-ext, web1]
      security_zone: dmz
      capacity_mbps: 1000
    dmz_app:
      type: lan
      cidr: 10.10.50.0/24
      zone: DMZ
      members: [fw-ext, app1]
      security_zone: servers
      capacity_mbps: 1000
    internet:
      type: external
      cidr: 203.0.113.0/24
      zone: OUTSIDE
      members: [fw-ext, external1]
      security_zone: external
      capacity_mbps: 1000
  zone_policies:
    # fw-int: internal segmentation. A zone pair absent here has no ruleset and
    # is denied by the zone model, which is what isolates the VLANs.
    - {node: fw-int, from: USERS, to: UPLINK, action: accept}
    - {node: fw-int, from: GUEST, to: UPLINK, action: accept}
    - {node: fw-int, from: FINANCE, to: UPLINK, action: accept}
    - {node: fw-int, from: MGMT, to: UPLINK, action: accept}
    - {node: fw-int, from: MGMT, to: USERS, action: accept}
    - {node: fw-int, from: MGMT, to: GUEST, action: accept}
    - {node: fw-int, from: MGMT, to: FINANCE, action: accept}
    - {node: fw-int, from: UPLINK, to: USERS, action: accept}
    - {node: fw-int, from: UPLINK, to: GUEST, action: accept}
    - {node: fw-int, from: UPLINK, to: FINANCE, action: accept}
    - {node: fw-int, from: USERS, to: GUEST, action: drop}
    - {node: fw-int, from: USERS, to: FINANCE, action: drop}
    - {node: fw-int, from: GUEST, to: FINANCE, action: drop}
    # fw-ext: the DMZ and the Internet.
    - {node: fw-ext, from: INTERNAL, to: DMZ, action: accept}
    - {node: fw-ext, from: INTERNAL, to: OUTSIDE, action: accept}
    - {node: fw-ext, from: OUTSIDE, to: DMZ, action: accept}
    - {node: fw-ext, from: DMZ, to: INTERNAL, action: accept}
    - {node: fw-ext, from: DMZ, to: OUTSIDE, action: accept}
    - {node: fw-ext, from: OUTSIDE, to: INTERNAL, action: drop}
  services:
    web_http:
      node: web1
      transport: tcp
      port: 80
      application: http
      security: cleartext
    app_test:
      node: app1
      transport: tcp
      port: 5201
      application: iperf3
