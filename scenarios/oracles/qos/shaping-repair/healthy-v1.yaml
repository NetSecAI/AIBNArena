schema_version: "1.0"
oracle_id: qos.shaping_repair.healthy
version: 1.0.0
description: >-
  This family degrades a policy and leaves the link idle, so the oracle offers the
  contention itself -- an unshaped link with nothing disputing it measures the same
  whether the policy is intact or gone.

    The protected class was broadly served before the fault. Half the contractual rate
  rather than all of it: this only has to tell a policy that works from one that was
  already degraded, and the measurement taken here is the reference the repair bar is
  later capped by, so demanding the full contract of it would beg the question.
domain: qos
phase: healthy
probes:
  - id: protected_flow
    type: throughput
    source: "${bindings.protected_source}"
    destination: "${bindings.sink_ip}"
    protocol: tcp
    measurement:
      protected_source: "${bindings.protected_source}"
      sink_ip: "${bindings.sink_ip}"
      destination: "${bindings.destination}"
      destination_ip: "${bindings.destination_ip}"
      assured_bandwidth_mbps: "${bindings.assured_bandwidth_mbps}"
      measurement_port: "${bindings.measurement_port}"
      background_source: "${bindings.background_source}"
      load_port: "${bindings.load_port}"
      link_mbps: "${bindings.link_mbps}"
      seconds: 10
      contended: true
    attempts: 1
    timeout_seconds: 60
    metrics: [success, throughput_mbps, timed_out]
    thresholds:
      - metric: throughput_mbps
        operator: gte
        value: "${bindings.assured_bandwidth_mbps}"
        factor: 0.5
    aggregation: {method: mean}
    success: {mode: all}
success: {mode: all}
