schema_version: "1.0"
oracle_id: qos.shaping_repair.preservation
version: 1.0.0
description: >-
  Every required path unrelated to the shaped flow remains loss-free. Reachability,
  not rate: a shaping policy is repaired on the WAN edge, and what must not be
  collateral damage is the rest of the fabric still forwarding.
domain: qos
phase: preservation
probes:
  - id: unaffected_paths
    type: connectivity_matrix
    source: testbed
    destination: unaffected_paths
    protocol: icmp
    scope: unaffected
    affected_nodes: "${bindings.affected_nodes}"
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, passed_checks, failed_checks]
    thresholds:
      - {metric: failed_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
success: {mode: all}
