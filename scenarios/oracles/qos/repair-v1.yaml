schema_version: "1.0"
oracle_id: qos.path.repair
version: 1.0.0
description: Loss and latency return close to their recorded baseline.
domain: qos
phase: repair
probes:
  - id: primary_path_quality
    type: icmp
    source: "${bindings.source}"
    destination: "${bindings.destination_ip}"
    protocol: icmp
    attempts: 5
    timeout_seconds: 2
    metrics: [packet_loss_percent, rtt_avg_ms]
    thresholds:
      - {metric: packet_loss_percent, operator: lte, value: 0}
      - metric: rtt_avg_ms
        operator: lte
        baseline: {metric: rtt_avg_ms, factor: 1.5, offset: 5}
    aggregation: {method: mean}
    success: {mode: all}
success: {mode: all}
