schema_version: "1.0"
oracle_id: qos.assured_bandwidth.repair
version: 1.2.0
description: >-
  The competing flow is this family's own fault, so the oracle neither starts one
  nor stops the one that is there. The pre-fault measurement therefore lands on an
  idle link, which is the point: it says the path can carry the rate at all, and so
  separates a broken path from a broken policy when the later numbers come in low.

    The protected class holds its share again, measured through the same contention the
  fault was measured under -- a repair only counts if the class survives a link that
  is actually disputed, not one that happens to be quiet. Same floor as the
  degradation oracle, so the two cannot disagree about what "served" means.

    And the circuit is still there. The protected flow alone cannot tell a
  repaired policy from a circuit that was taken away: measured in e10, deleting the
  root qdisc let the flow read some 80 Mbps, and raising the root rate to 16 or
  60 Mbps cleared the floor as well. What leaves the shaped interface during the
  sample, both flows together, is capped at the link rate plus a fifth for header
  and burst accounting, so only a repair inside the circuit passes.

    And the flood is still there. It runs for a fixed duration, and the E12 to E18
  campaigns ran past it: the probe then found user1 alone on the link, and an
  untouched network passed (pistes_e19, B5). The flood is looked for on guest1
  before and after the sample (fault_flood), and a sample it did not cover reports
  no throughput_mbps, so the phase fails rather than scoring an idle link.
domain: qos
phase: repair
probes:
  - id: protected_flow
    type: throughput
    source: "${bindings.protected_source}"
    destination: "${bindings.sink_ip}"
    protocol: tcp
    measurement:
      protected_source: "${bindings.protected_source}"
      sink_ip: "${bindings.sink_ip}"
      destination: "${bindings.destination}"
      destination_ip: "${bindings.destination_ip}"
      assured_bandwidth_mbps: "${bindings.assured_bandwidth_mbps}"
      measurement_port: "${bindings.measurement_port}"
      link_mbps: "${bindings.link_mbps}"
      wan_edge: "${bindings.wan_edge}"
      shaped_interface: "${bindings.shaped_interface}"
      background_source: "${bindings.background_source}"
      seconds: 10
      contended: false
      fault_flood: true
    attempts: 1
    timeout_seconds: 60
    metrics: [success, throughput_mbps, circuit_egress_mbps, timed_out]
    thresholds:
      - metric: throughput_mbps
        operator: gte
        value: "${bindings.assured_bandwidth_mbps}"
        factor: 0.85
        baseline: {metric: throughput_mbps, factor: 0.85}
        combine: min
      - metric: circuit_egress_mbps
        operator: lte
        value: "${bindings.link_mbps}"
        factor: 1.2
    aggregation: {method: mean}
    success: {mode: all}
success: {mode: all}
