schema_version: "1.0"
oracle_id: dhcp_dns.provisioning.healthy
version: 1.2.0
description: >-
  Every topology-required path is loss-free before the provisioning fault. A DHCP
  client that never obtained a lease has no address to be reached at, so this also
  establishes that provisioning worked in the reference state. The affected client must
  also resolve a name of the lab's own zone: a lease is an address, a gateway and a
  resolver, and a reachable desk that cannot resolve was not provisioned either.
  The name is the binding's `probe_name`: the client's own, in the zone of the
  resolver its lease names, which holds a record for every endpoint of the lab
  (`guest1.sme01.internal`, `host-access-4.campus.lab`). Fully qualified, because
  containerlab writes every node's short name into each container's /etc/hosts,
  which answers it with the management address whatever DHCP and DNS do -- as it
  answered `web1`, the name asked for until 1.2.0. The wait is what a wrong resolver
  costs a musl getent (5 s per server, two attempts).
domain: dhcp_dns
phase: healthy
probes:
  - id: required_paths
    type: connectivity_matrix
    source: testbed
    destination: required_paths
    protocol: icmp
    scope: all
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, passed_checks, failed_checks]
    thresholds:
      - {metric: failed_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
  - id: name_resolution
    type: dns
    source: "${bindings.client}"
    destination: "${bindings.probe_name}"
    protocol: dns
    attempts: 2
    timeout_seconds: 12
    metrics: [success, answer_count]
    thresholds:
      - {metric: answer_count, operator: eq, value: 2}
    aggregation: {method: all_attempts}
    success: {mode: all}
success: {mode: all}
