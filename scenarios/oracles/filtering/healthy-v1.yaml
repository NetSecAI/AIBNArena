schema_version: "1.0"
oracle_id: filtering.policy.healthy
version: 1.1.0
description: >-
  Every topology-required path is loss-free before the policy fault, and every
  isolated pair is blocked. Required paths are the flows the zone policy is meant
  to permit and isolated pairs the ones it is meant to stop, so a clean run here is
  evidence that the reference policy does both. The isolated pairs are checked
  here as well as after the repair so that a pair listed by mistake -- one the
  healthy lab does not actually block -- fails the episode before the fault
  instead of failing a correct repair later.
domain: filtering
phase: healthy
probes:
  - id: required_paths
    type: connectivity_matrix
    source: testbed
    destination: required_paths
    protocol: icmp
    scope: all
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, passed_checks, failed_checks]
    thresholds:
      - {metric: failed_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
  - id: denied_paths
    type: isolation_matrix
    source: testbed
    destination: isolation_requirements
    protocol: icmp
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, blocked_checks, leaked_checks]
    thresholds:
      - {metric: leaked_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
success: {mode: all}
