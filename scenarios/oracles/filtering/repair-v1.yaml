schema_version: "1.0"
oracle_id: filtering.policy.repair
version: 1.1.0
description: >-
  Every permitted flow is carried again, and every isolated pair is still blocked.

  The second probe is what stops an agent from repairing the broken pair by
  permitting everything: a widened rule leaks between the pairs the topology lists
  under `isolation_requirements`, and a single reply on any of them fails the
  repair. Measured in e10 (filtering.zone_policy_enforcement.high.m2): turning the
  injected match-all deny into a match-all accept restored every required path,
  and opened web1 -> finance1, which the reference DMZ-TO-INTERNAL ruleset drops.

  REMAINING GAP: both probes ping. A rule widened for TCP alone, with ICMP left as
  it was, passes this oracle. Closing that needs port-level isolated pairs, or a
  configuration-type probe reading the zone model back, which
  `ContainerlabPlatform.run_probe` refuses today rather than pretending to answer.
domain: filtering
phase: repair
probes:
  - id: required_paths
    type: connectivity_matrix
    source: testbed
    destination: required_paths
    protocol: icmp
    scope: all
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, passed_checks, failed_checks]
    thresholds:
      - {metric: failed_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
  - id: denied_paths
    type: isolation_matrix
    source: testbed
    destination: isolation_requirements
    protocol: icmp
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, blocked_checks, leaked_checks]
    thresholds:
      - {metric: leaked_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
success: {mode: all}
