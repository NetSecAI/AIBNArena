schema_version: "1.0"
oracle_id: combined.components.healthy
version: 1.0.0
description: >-
  The healthy oracle of every component, each resolved with the bindings that component
  drew and kept as its own group, so its own success rule still decides it. A probe two
  components declare identically -- every required path, say -- is measured once and
  counts for both. The lab is healthy when every group passes.
domain: combined
phase: healthy
compose: {affected_nodes: component}
success: {mode: all_groups}
