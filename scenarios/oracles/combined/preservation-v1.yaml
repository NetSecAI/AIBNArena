schema_version: "1.0"
oracle_id: combined.unrelated_paths.preservation
version: 1.0.0
description: >-
  Every required path unrelated to any fault of the combination remains loss-free. The
  components' preservation oracles are resolved with the union of the blast radii rather
  than each with its own: a path another fault cut is that fault's to repair, and the
  repair oracle says whether it was, so counting it here would charge an unrepaired fault
  twice and call it a regression.
domain: combined
phase: preservation
compose: {affected_nodes: union}
success: {mode: all_groups}
