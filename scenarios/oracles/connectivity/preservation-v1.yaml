schema_version: "1.0"
oracle_id: connectivity.unrelated_paths.preservation
version: 1.0.0
description: Every required path unrelated to the affected endpoints remains loss-free.
domain: connectivity
phase: preservation
probes:
  - id: unaffected_paths
    type: connectivity_matrix
    source: testbed
    destination: unaffected_paths
    protocol: icmp
    scope: unaffected
    affected_nodes: "${bindings.affected_nodes}"
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, passed_checks, failed_checks]
    thresholds:
      - {metric: failed_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
success: {mode: all}
