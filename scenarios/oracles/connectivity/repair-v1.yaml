schema_version: "1.0"
oracle_id: connectivity.path.repair
version: 1.0.0
description: Every topology-required path returns to its loss-free reference behavior.
domain: connectivity
phase: repair
probes:
  - id: required_paths
    type: connectivity_matrix
    source: testbed
    destination: required_paths
    protocol: icmp
    scope: all
    attempts: 3
    timeout_seconds: 1
    metrics: [success, total_checks, passed_checks, failed_checks]
    thresholds:
      - {metric: failed_checks, operator: eq, value: 0}
    aggregation: {method: all_attempts}
    success: {mode: all}
success: {mode: all}
