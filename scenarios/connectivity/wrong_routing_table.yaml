schema_version: "0.1"
version: "1.0.0"
oracles:
  healthy: {path: scenarios/oracles/connectivity/healthy-v1.yaml, version: "1.0.0"}
  expected_degradation: {path: scenarios/oracles/connectivity/expected-degradation-v1.yaml, version: "1.0.0"}
  repair: {path: scenarios/oracles/connectivity/repair-v1.yaml, version: "1.0.0"}
  preservation: {path: scenarios/oracles/connectivity/preservation-v1.yaml, version: "1.0.0"}
scenario: wrong_routing_table
task:
  low: >-
    Something on this network is not working the way it should. Put it back.
  medium: >-
    Restore the intended IPv4 connectivity between affected endpoints without disrupting healthy
    paths.
  high: >-
    {{affected_nodes}} lost IPv4 connectivity that the rest of the network still has. Restore the
    intended connectivity for those endpoints without disrupting the paths that still work.
base_variant: medium
success_criteria:
  all_of:
    - type: lab_connectivity
methods:
  - id: 1
    name: router_route_swapped_to_wrong_egress
    selector: {node: router, route: required_remote_prefix}
    operation: {name: set_static_route_next_hop, value_source: wrong_reachable_egress}
  - id: 2
    name: router_more_specific_blackhole
    selector: {node: router, route: required_remote_host}
    operation: {name: set_static_route_disposition, disposition: blackhole}
  - id: 3
    name: router_route_via_unresolvable_next_hop
    selector: {node: router, route: required_remote_prefix}
    operation: {name: set_static_route_next_hop, value_source: unresolvable_address}
  - id: 4
    name: router_next_hop_loop
    selector: {node: router, route: required_remote_prefix}
    operation: {name: create_static_route_loop}
  - id: 5
    name: endpoint_wrong_default_gateway
    selector: {node: endpoint}
    operation: {name: set_default_route_gateway, value_source: unused_same_subnet_address}
